version: 2
updates:
  - package-ecosystem: github-actions
    assignees:
      - rraziel
    commit-message:
      prefix: dep(github-actions)
      include: scope
    directory: /
    labels:
      - dependencies
      - github-actions
    rebase-strategy: disabled
    schedule:
      day: saturday
      interval: weekly
      time: '09:00'
  - package-ecosystem: npm
    assignees:
      - rraziel
    commit-message:
      prefix: dep(npm)
      include: scope
    directory: /
    labels:
      - dependencies
      - npm
    rebase-strategy: auto
    schedule:
      interval: daily
    version-strategy: increase
