name: CI

on:
  - push
  - pull_request

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # TODO: keep a depth and separately checkout main

      - name: Cache pnpm modules
        uses: actions/cache@v2
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v1.2.1
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}

      - name: Lint (workspace)
        run: pnpm lint:workspace

      - name: Lint (affected)
        run: pnpm lint:affected
        if: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint
        run: pnpm lint
        if: ${{ github.ref == 'refs/heads/main' }}

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # TODO: keep a depth and separately checkout main

      - name: Cache pnpm modules
        uses: actions/cache@v2
        env:
          cache-name: cache-pnpm-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v1.2.1
        with:
          version: 5.18.9
          run_install: |
            - args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Test (affected)
        run: pnpm test:affected
        if: ${{ github.ref != 'refs/heads/main' }}

      - name: Test
        run: pnpm test
        if: ${{ github.ref == 'refs/heads/main' }}
