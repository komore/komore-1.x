name: CI

on:
  - push
  - pull_request

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Derivate SHAs for base and head for affected commands
        uses: nrwl/nx-set-shas@v2

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2.4.0
        with:
          version: 8.11.0
          run_install: false

      - name: Get the pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Lint (workspace)
        run: pnpm lint:workspace
        if: ${{ false }}

      - name: Lint (affected)
        run: pnpm lint:affected
        if: ${{ false && github.ref != 'refs/heads/main' }}

      - name: Lint
        run: pnpm lint
        if: ${{ false && github.ref == 'refs/heads/main' }}

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Derivate SHAs for base and head for affected commands
        uses: nrwl/nx-set-shas@v2

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2.4.0
        with:
          version: 8.11.0
          run_install: false

      - name: Get the pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Test (affected)
        run: pnpm test:affected
        if: ${{ false && github.ref != 'refs/heads/main' }}

      - name: Test
        run: pnpm test
        if: ${{ false && github.ref == 'refs/heads/main' }}

  build:
    name: Build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Derivate SHAs for base and head for affected commands
        uses: nrwl/nx-set-shas@v2

      - name: Setup Node
        uses: actions/setup-node@v1
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2.4.0
        with:
          version: 8.11.0
          run_install: false

      - name: Get the pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Buid (affected)
        run: pnpm build:affected
        if: ${{ false && github.ref != 'refs/heads/main' }}

      - name: Build
        run: pnpm build
        if: ${{ false && github.ref == 'refs/heads/main' }}
